# Configuração da URL do Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/corporative_db?createDatabaseIfNotExist=true&serverTimezone=UTC

# Seu usuário do MySQL (geralmente é root)
spring.datasource.username=root

# A senha do seu MySQL aí do seu computador
spring.datasource.password=

# Driver de conexão
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate / JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ddl-auto: cria as tabelas automaticamente se elas não existirem
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
